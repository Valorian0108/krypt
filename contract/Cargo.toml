[package]
name = "policy-contract"
version = "0.1.0"
edition = "2021"
description = "A NEAR policy contract that bounds what an AI agent may spend: rules, budget, allowlist, expiry, readable receipts, and owner approvals."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

# Security choice: money arithmetic must panic loudly on overflow instead of
# silently wrapping. Recommended by the NEAR security checklist. The binary
# is larger because of it, deliberately. `strip` removes debug symbols from
# the deployed bytes, which lowers the on-chain storage deposit.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
overflow-checks = true
strip = true
