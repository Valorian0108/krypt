[package]
name = "worker-contract"
version = "0.1.0"
edition = "2021"
description = "Job board counterparty for the NEAR policy agent demo: publishes quotes, fulfils jobs with a verifiable digest, and keeps the record on-chain."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

# Same profile as the policy contract: smallest possible deployed bytes,
# because on NEAR every byte of code is staked at the storage price, and
# loud panics on overflow because this contract quotes money.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
overflow-checks = true
strip = true
